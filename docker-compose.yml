services:
  middleware:
    build:
      context: .
      dockerfile: Dockerfile.middleware
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    networks:
      - crisis-net
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - API_URL=http://middleware:8000
    depends_on:
      - middleware
    networks:
      - crisis-net
    restart: always

networks:
  crisis-net:
    driver: bridge
