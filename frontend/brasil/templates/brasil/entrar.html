<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Crisis Monitor Brasil</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("br-tema"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='lp/public/logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('brasil.static', filename='brasil.css') }}">
</head>
<body class="solta">
  <main class="entrar cartao">
    <a class="marca" href="{{ url_for('brasil.inicio') }}"><span class="marca-nome">Crisis Monitor</span> <span class="marca-selo">Brasil</span></a>
    <h1>Entrar</h1>
    <p class="vazio">Crises brasileiras de INPE, CEMADEN, INMET, notícias de fontes confiáveis e fontes globais filtradas para o Brasil.</p>
    <form class="form" method="post">
      {% if erro %}<p class="aviso" role="alert">{{ erro }}</p>{% endif %}
      <label>E-mail <input type="email" name="email" required autocomplete="email"></label>
      <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
      <button class="botao botao-primario" type="submit">Entrar</button>
    </form>
    {% if dev_login %}
    <div class="teste">
      <p class="cartao-titulo">Logins de teste (BRASIL_DEV_LOGIN=1)</p>
      <div class="acoes">
        <a class="botao botao-secundario" href="{{ url_for('brasil.dev_login', perfil='voluntario') }}">Voluntário</a>
        <a class="botao botao-secundario" href="{{ url_for('brasil.dev_login', perfil='ong') }}">ONG</a>
        <a class="botao botao-secundario" href="{{ url_for('brasil.dev_login', perfil='admin') }}">Admin</a>
      </div>
    </div>
    {% endif %}
  </main>
</body>
</html>
