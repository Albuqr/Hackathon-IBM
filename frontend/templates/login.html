<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><title>Login — Crisis Monitor</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='lp/public/logo.png') }}">
<link rel="shortcut icon" href="{{ url_for('static', filename='lp/public/logo.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='lp/public/logo.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Inter',system-ui,sans-serif;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.card{background:#060606;border:1px solid #1a1a1a;border-radius:12px;padding:40px 36px;width:360px;z-index:1;position:relative}
.logo{text-align:center;margin-bottom:28px}
.logo-main{font-size:18px;font-weight:600}
.logo-badge{margin-left:8px;border:1px solid #3b82f6;color:#3b82f6;border-radius:4px;padding:1px 7px;font-size:10px;font-family:'JetBrains Mono',monospace}
.logo-sub{color:#333;font-size:12px;margin-top:6px}
.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:16px}
label{display:block;color:#444;font-size:11px;margin-bottom:5px}
input{width:100%;height:38px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;color:#fff;font-size:13px;padding:0 12px;margin-bottom:14px;font-family:inherit;transition:border-color .15s}
input:focus{outline:none;border-color:#3b82f6}
input::placeholder{color:#2a2a2a}
.btn{width:100%;height:40px;background:#3b82f6;border:none;border-radius:6px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn:hover{background:#2563eb}
.footer{text-align:center;margin-top:20px;color:#333;font-size:12px}
.footer a{color:#3b82f6;text-decoration:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card">
  <div class="logo">
    <div><span class="logo-main">🛰 Crisis Monitor</span><span class="logo-badge">HKTN26</span></div>
    <div class="logo-sub">Plataforma de Mobilização Humanitária</div>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" placeholder="seu@email.com" required>
    <label>Senha</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <div class="footer">Não tem conta? <a href="/register">Cadastre-se</a></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let m={x:-999,y:-999};
function r(){c.width=innerWidth;c.height=innerHeight}
r();addEventListener('resize',r);
addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});
function draw(){
  x.clearRect(0,0,c.width,c.height);
  for(let gx=0;gx<c.width;gx+=24)
    for(let gy=0;gy<c.height;gy+=24){
      const d=Math.sqrt((m.x-gx)**2+(m.y-gy)**2);
      const t=Math.max(0,1-d/130);
      const b=Math.round(0x1e+(0x58-0x1e)*t).toString(16).padStart(2,'0');
      x.fillStyle='#'+b+b+b;
      x.beginPath();x.arc(gx,gy,1.5,0,Math.PI*2);x.fill();
    }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
