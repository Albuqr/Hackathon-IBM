<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crisis — Humanitarian Intelligence</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='lp/public/logo.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='lp/public/logo.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='lp/public/logo.png') }}">

  <link rel="stylesheet" crossorigin href="{{ url_for('static', filename='lp/assets/index-BvWYjAPO.css') }}">

  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" crossorigin src="{{ url_for('static', filename='lp/assets/index-CVCDW_Tp.js') }}"></script>

  <script>
    // ── Smooth wheel scroll (desktop only) ──────────────────────────────
    var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ||
                   window.matchMedia('(pointer: coarse)').matches;
    if (!isMobile) {
      document.addEventListener('wheel', function(e) {
        e.preventDefault();
        window.scrollBy({ top: e.deltaY * 0.85, behavior: 'smooth' });
      }, { passive: false });
    }

    // ── Skill map: landing dropdown text → register.html option values ──
    var SKILL_MAP = {
      'Médico / Saúde':       'medical',
      'Resgate e Campo':      'SAR',
      'Logística de Suporte': 'logistics',
      'Arquitetura de Dados': 'engineering',
      'Engenharia':           'engineering',
      'Logística':            'logistics',
      'Tecnologia':           'general',
      'Educação':             'general',
      'Comunicação':          'communication',
      'Jurídico':             'general',
      'Outros':               'general'
    };

    function readFormFields() {
      var section = document.getElementById('registration-form');
      var form    = section ? section.querySelector('form') : null;
      var nome    = '';
      var skill   = '';
      if (form) {
        var nameInput  = form.querySelector('input[type="text"]');
        var skillField = form.querySelector('select');
        nome  = nameInput  ? nameInput.value.trim()  : '';
        skill = skillField ? (SKILL_MAP[skillField.value] || skillField.value) : '';
      }
      return { nome: nome, skill: skill };
    }

    // ── Intercept form submit (capture phase, before React's handler) ───
    document.addEventListener('submit', function(e) {
      if (e.target && e.target.closest && e.target.closest('#registration-form')) {
        e.preventDefault();
        e.stopImmediatePropagation();
        var f = readFormFields();
        var params = [];
        if (f.nome)  params.push('nome='  + encodeURIComponent(f.nome));
        if (f.skill) params.push('skill=' + encodeURIComponent(f.skill));
        window.location.href = '/register' + (params.length ? '?' + params.join('&') : '');
      }
    }, true);

    // ── Patch buttons after React mounts ────────────────────────────────
    (function patchButtons() {
      var found = { acesso: false, acessarHub: false, acessoInstitucional: false };

      document.querySelectorAll('button').forEach(function(btn) {
        if (btn._lp_patched) return;
        var txt = (btn.innerText || '').trim();

        // Nav "Acesso" → /login
        if (txt === 'Acesso') {
          btn._lp_patched = true;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            window.location.href = '/login';
          }, true);
          found.acesso = true;
        }

        // Hero "Acessar Hub" CTA → /login
        if (txt.includes('Acessar Hub')) {
          btn._lp_patched = true;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            window.location.href = '/login';
          }, true);
          found.acessarHub = true;
        }

        // Registration "Acesso Institucional" tab → /register?tipo=org&nome=...
        if (txt.includes('Acesso Institucional')) {
          btn._lp_patched = true;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            var f = readFormFields();
            var url = '/register?tipo=org';
            if (f.nome) url += '&nome=' + encodeURIComponent(f.nome);
            window.location.href = url;
          }, true);
          found.acessoInstitucional = true;
        }
      });

      if (!found.acesso || !found.acessarHub || !found.acessoInstitucional) {
        setTimeout(patchButtons, 150);
      }
    })();
  </script>
</body>
</html>
